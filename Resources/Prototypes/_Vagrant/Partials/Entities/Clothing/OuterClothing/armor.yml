- type: entity
  id: ClothingOuterArmorBase
  description: A standard Type III-A armored vest that provides decent protection against most melee weapons and calibers.
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Armor/security.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Armor/security.rsi
  - type: Armor
    modifiers: # Vests are buffed across the board, *sure* this technically makes bartenders worse to deal with but stunmeta still exists so who cares
      coefficients: # >isn't 0.5 ballistic bloodred values? this isn't spaceproof and it's "harder" to get since sec >>should<< be way more careful with their gear here
        Blunt: 0.6 # 0.65 -> 0.6
        Slash: 0.6 # 0.65 -> 0.6
        Piercing: 0.6 # 0.65 -> 0.6
        Ballistic: 0.5 # 0.65 -> 0.5
        Heat: 0.65 # 0.8 -> 0.65
      !Remove flatReductions: # no need for flatreductions when you can just partial -AP onto the offending ammos

- type: entity
  parent: [ BaseSecurityBartenderContraband, ClothingOuterArmorBasic ]
  id: ClothingOuterArmorBasicSlim
  name: soft armor vest
  description: A slim Type III-A soft armored vest that provides decent protection against most melee weapons and calibers.

- type: entity
  parent: ClothingOuterArmorBasic
  id: ClothingOuterArmorBulletproof
  name: bulletproof vest
  description: A Type IV heavy bulletproof vest that excels in protecting the wearer against traditional projectile weaponry, and also explosives to a minor extent.
  components:
  - type: Armor
    modifiers:
      coefficients:
        Ballistic: 0.25 # 0.3 -> 0.25, and no higher or else Evil:tm:
      !Remove flatReductions:
